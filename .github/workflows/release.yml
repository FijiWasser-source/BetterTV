name: Release

# Neue Version veröffentlichen: versionName/versionCode in app/build.gradle erhöhen,
# dann ein Tag pushen, z. B.  git tag v5.5 && git push origin v5.5
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Signatur-Schlüssel aus den Secrets holen
        env:
          KEYSTORE_BASE64: ${{ secrets.BETTERTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret BETTERTV_KEYSTORE_BASE64 fehlt (siehe README, Abschnitt Veröffentlichen)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Tests und signierte Release-APK
        env:
          BETTERTV_KEYSTORE: ${{ runner.temp }}/release.jks
          BETTERTV_KEYSTORE_PASSWORD: ${{ secrets.BETTERTV_KEYSTORE_PASSWORD }}
          BETTERTV_KEY_ALIAS: ${{ secrets.BETTERTV_KEY_ALIAS }}
          BETTERTV_KEY_PASSWORD: ${{ secrets.BETTERTV_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "bettertv-${GITHUB_REF_NAME#v}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: bettertv-*.apk
          generate_release_notes: true
