name: TV-Launcher bauen

on:
  push:
    paths: ["tv-launcher/**", ".github/workflows/tv-launcher.yml"]
  pull_request:
    paths: ["tv-launcher/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: klar-launcher-apk
          path: tv-launcher/app/build/outputs/apk/debug/app-debug.apk
