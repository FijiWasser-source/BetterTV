plugins {
    id 'com.android.application'
    id 'app.cash.paparazzi' version '1.3.5'
}

android {
    namespace 'de.bettertv.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'de.bettertv.launcher'
        minSdk 21
        targetSdk 35
        versionCode 41
        versionName "5.5"
    }

    // Release-Signatur nur aus Umgebungsvariablen (GitHub-Secrets), nie im Repo.
    def ks = System.getenv('BETTERTV_KEYSTORE')
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('BETTERTV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BETTERTV_KEY_ALIAS')
                keyPassword System.getenv('BETTERTV_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
